# Layouts canônicos de entrada — derivados das tabelas fato (Etapa 5).
# Uma entrada = um layout. Upload (CSV ';' ou ',', ou XLSX) e formulários usam a mesma validação.
#
# Tipos de campo: texto | inteiro | decimal | data (AAAA-MM-DD) | instante (AAAA-MM-DD HH:MM[:SS]) | hora (HH:MM) | sim_nao (S/N)
# Atributos: obrigatorio, min, max, max_len, lista (lista fechada abaixo), ref (cadastro de referência)
#   ref.ausente: rejeitar  → código fora do cadastro recusa a linha (poka-yoke)
#                inferir   → cria membro inferido (Etapa 4, regra 4); usado em extrações de ERP
# regras: expressões sobre a linha já tipada; vazio(x) testa ausência.
# regex: padrão obrigatório (CNPJ, placa, chave de NF-e).
# politica: tudo_ou_nada → uma linha inválida recusa o arquivo inteiro (nada chega ao fato; o bruto guarda tudo).

listas:
  sim_nao: [S, N]
  tipo_local: [PICKING, PULMAO, DOCA, QUARENTENA, EXPEDICAO, PRODUCAO, DEPOSITO]
  classe_temperatura: [SECO, REFRIGERADO, CONGELADO]
  tipo_sku: [MP, PA, EMBALAGEM, REVENDA]
  unidade: [UN, CX, FD, PL, KG, L, M3]
  funcao: [INVENTARIANTE, CONFERENTE, SEPARADOR, OPERADOR, MOTORISTA, SUPERVISOR, ANALISTA]
  processo_motivo: [RECEBIMENTO, DIVERGENCIA, AJUSTE, BAIXA, CORTE, PARADA, REFUGO, DEVOLUCAO, ENTREGA_FRUSTRADA, CANCELAMENTO]
  etapa_origem: [RECEBIMENTO, ENDERECAMENTO, SEPARACAO, CONFERENCIA, DESCONHECIDA, NAO_SE_APLICA]
  categoria_perda: [VENCIMENTO, AVARIA, AJUSTE, OUTRO, NAO_SE_APLICA]
  documento_tipo: [RECEBIMENTO, OP, SEPARACAO, NF_SAIDA, NF_ENTRADA, CONTAGEM, TRANSFERENCIA, AJUSTE, OUTRO]
  uf: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
  tipo_veiculo: [VUC, TOCO, TRUCK, CARRETA, UTILITARIO]
  tipo_recurso: [LINHA, MAQUINA, CELULA]
  evento_pedido: [EMISSAO, ALTERACAO, CANCELAMENTO]
  evento_pedido_venda: [CRIACAO, ALTERACAO, CANCELAMENTO]
  status_entrega: [ENTREGUE, PARCIAL, FRUSTRADA]

# dim_tipo_movimento (Etapa 5, ajuste 1). Lista fechada; sinal = sinal esperado da quantidade.
tipos_movimento:
  ENTRADA_RECEBIMENTO:   {sinal: 1,  afeta_disponivel: true}
  ENTRADA_PRODUCAO:      {sinal: 1,  afeta_disponivel: true}
  ENTRADA_DEVOLUCAO:     {sinal: 1,  afeta_disponivel: true}
  SAIDA_EXPEDICAO:       {sinal: -1, afeta_disponivel: true}
  SAIDA_CONSUMO:         {sinal: -1, afeta_disponivel: true}
  TRANSFERENCIA_SAIDA:   {sinal: -1, afeta_disponivel: true}
  TRANSFERENCIA_ENTRADA: {sinal: 1,  afeta_disponivel: true}
  AJUSTE_POSITIVO:       {sinal: 1,  afeta_disponivel: true}
  AJUSTE_NEGATIVO:       {sinal: -1, afeta_disponivel: true}
  BAIXA:                 {sinal: -1, afeta_disponivel: true}

# Motivos padrão do produto. O tenant sobrescreve pelo cadastro (mesmo código) ou acrescenta.
# Não existe "OUTRO" com texto livre (Etapa 4): o que a lista não cobre vai para DESCONHECIDO.
motivos_padrao:
  - {codigo: DESCONHECIDO,     descricao: Origem não identificada,             processo: DIVERGENCIA, etapa_origem: DESCONHECIDA,  gera_baixa: N, categoria_perda: AJUSTE,        controlavel: N}
  - {codigo: DIV_RECEBIMENTO,  descricao: Erro de recebimento/conferência de entrada, processo: DIVERGENCIA, etapa_origem: RECEBIMENTO, gera_baixa: N, categoria_perda: AJUSTE, controlavel: S}
  - {codigo: DIV_ENDERECAMENTO, descricao: Produto armazenado em endereço errado, processo: DIVERGENCIA, etapa_origem: ENDERECAMENTO, gera_baixa: N, categoria_perda: AJUSTE,       controlavel: S}
  - {codigo: DIV_SEPARACAO,    descricao: Separação de item/quantidade errada,  processo: DIVERGENCIA, etapa_origem: SEPARACAO,     gera_baixa: N, categoria_perda: AJUSTE,        controlavel: S}
  - {codigo: DIV_CONFERENCIA,  descricao: Erro não detectado na conferência,    processo: DIVERGENCIA, etapa_origem: CONFERENCIA,   gera_baixa: N, categoria_perda: AJUSTE,        controlavel: S}
  - {codigo: BAIXA_VENCIMENTO, descricao: Descarte por vencimento,              processo: BAIXA,       etapa_origem: NAO_SE_APLICA, gera_baixa: S, categoria_perda: VENCIMENTO,    controlavel: S}
  - {codigo: BAIXA_AVARIA,     descricao: Descarte por avaria,                  processo: BAIXA,       etapa_origem: NAO_SE_APLICA, gera_baixa: S, categoria_perda: AVARIA,        controlavel: S}
  - {codigo: CORTE_FALTA_SALDO,  descricao: Corte por falta de saldo disponível,  processo: CORTE,       etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: S}
  - {codigo: CORTE_VALIDADE,     descricao: Corte por falta de lote com validade aceita pelo cliente, processo: CORTE, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: S}
  - {codigo: ENT_CLIENTE_FECHADO, descricao: Cliente fechado / sem recebedor,     processo: ENTREGA_FRUSTRADA, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: N}
  - {codigo: ENT_FORA_JANELA,    descricao: Chegada fora da janela do cliente,    processo: ENTREGA_FRUSTRADA, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: S}
  - {codigo: ENT_RECUSA_PARCIAL, descricao: Recusa parcial na entrega,            processo: ENTREGA_FRUSTRADA, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: S}
  - {codigo: REF_QUALIDADE,      descricao: Refugo por não conformidade,          processo: REFUGO,      etapa_origem: NAO_SE_APLICA, gera_baixa: S, categoria_perda: OUTRO,         controlavel: S}
  - {codigo: REC_AVARIA,         descricao: Recusa no recebimento por avaria,     processo: RECEBIMENTO, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: N}
  - {codigo: REC_VALIDADE,       descricao: Recusa no recebimento por validade curta, processo: RECEBIMENTO, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: N}
  - {codigo: CANC_CLIENTE,       descricao: Cancelamento solicitado pelo cliente, processo: CANCELAMENTO, etapa_origem: NAO_SE_APLICA, gera_baixa: N, categoria_perda: NAO_SE_APLICA, controlavel: N}

layouts:

  # ------------------------------------------------------------------ cadastros
  cad_site:
    descricao: Site (planta ou CD) com fuso e horário de corte do dia operacional
    canal: [upload]
    destino: dim_site
    implementado: true
    chave: [site]
    campos:
      site:          {tipo: texto, obrigatorio: true, max_len: 20}
      descricao:     {tipo: texto, obrigatorio: true, max_len: 80}
      horario_corte: {tipo: hora, obrigatorio: true}

  cad_local:
    descricao: Endereço de armazenagem (ou depósito, se o ERP não tiver endereço)
    canal: [upload]
    destino: dim_local
    implementado: true
    chave: [endereco]
    campos:
      endereco:           {tipo: texto, obrigatorio: true, max_len: 30}
      site:               {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      zona:               {tipo: texto, obrigatorio: true, max_len: 20}
      tipo:               {tipo: texto, obrigatorio: true, lista: tipo_local}
      classe_temperatura: {tipo: texto, obrigatorio: true, lista: classe_temperatura}

  cad_sku:
    descricao: SKU com unidade base, vida útil, peso e volume
    canal: [upload]
    destino: dim_sku
    implementado: true
    chave: [sku]
    campos:
      sku:                         {tipo: texto, obrigatorio: true, max_len: 30}
      descricao:                   {tipo: texto, obrigatorio: true, max_len: 120}
      tipo:                        {tipo: texto, obrigatorio: true, lista: tipo_sku}
      familia:                     {tipo: texto, obrigatorio: true, max_len: 30}
      unidade_base:                {tipo: texto, obrigatorio: true, lista: unidade}
      controla_lote:               {tipo: sim_nao, obrigatorio: true}
      shelf_life_dias:             {tipo: inteiro, obrigatorio: false, min: 1, max: 3650}
      validade_minima_padrao_dias: {tipo: inteiro, obrigatorio: false, min: 0, max: 3650}
      classe_temperatura:          {tipo: texto, obrigatorio: true, lista: classe_temperatura}
      peso_bruto_kg_un_base:       {tipo: decimal, obrigatorio: true, min: 0.000001, max: 5000}
      volume_m3_un_base:           {tipo: decimal, obrigatorio: true, min: 0.0000001, max: 50}
      codigo_barras:               {tipo: texto, obrigatorio: false, max_len: 30}
    regras:
      - {expr: "vazio(validade_minima_padrao_dias) or vazio(shelf_life_dias) or validade_minima_padrao_dias < shelf_life_dias", msg: "validade mínima deve ser menor que o shelf life"}
      - {expr: "controla_lote == 'S' or vazio(shelf_life_dias)", msg: "SKU com shelf life precisa controlar lote"}

  cad_sku_unidade:
    descricao: Fator de conversão de unidade (un, caixa, fardo, palete, kg) para a unidade base
    canal: [upload]
    destino: sku_unidade
    implementado: true
    chave: [sku, unidade]
    campos:
      sku:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      unidade:          {tipo: texto, obrigatorio: true, lista: unidade}
      fator_para_base:  {tipo: decimal, obrigatorio: true, min: 0.000001, max: 1000000}
      e_unidade_palete: {tipo: sim_nao, obrigatorio: true}

  cad_lote:
    descricao: Lote com fabricação e validade (opcional — lotes também nascem dos movimentos e do saldo)
    canal: [upload]
    destino: dim_lote
    implementado: true
    chave: [sku, lote]
    campos:
      sku:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      lote:            {tipo: texto, obrigatorio: true, max_len: 30}
      data_fabricacao: {tipo: data, obrigatorio: false}
      data_validade:   {tipo: data, obrigatorio: true}
    regras:
      - {expr: "vazio(data_fabricacao) or data_validade > data_fabricacao", msg: "validade deve ser posterior à fabricação"}

  cad_motivo:
    descricao: Motivo (lista fechada por processo); sobrescreve os motivos padrão de mesmo código
    canal: [upload]
    destino: dim_motivo
    implementado: true
    chave: [codigo]
    campos:
      codigo:          {tipo: texto, obrigatorio: true, max_len: 30}
      descricao:       {tipo: texto, obrigatorio: true, max_len: 120}
      processo:        {tipo: texto, obrigatorio: true, lista: processo_motivo}
      etapa_origem:    {tipo: texto, obrigatorio: true, lista: etapa_origem}
      gera_baixa:      {tipo: sim_nao, obrigatorio: true}
      categoria_perda: {tipo: texto, obrigatorio: true, lista: categoria_perda}
      controlavel:     {tipo: sim_nao, obrigatorio: true}

  cad_colaborador:
    descricao: Colaborador (sem CPF e sem nome na camada analítica — LGPD)
    canal: [upload]
    destino: dim_colaborador
    implementado: true
    chave: [matricula]
    campos:
      matricula: {tipo: texto, obrigatorio: true, max_len: 20}
      funcao:    {tipo: texto, obrigatorio: true, lista: funcao}
      turno:     {tipo: texto, obrigatorio: true, max_len: 10}
      site:      {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}

  # ---------------------------------------------------- frente 1 (implementada)
  saldo_estoque:
    descricao: Fotografia de saldo de UM site num dia, extraída do ERP (substitui por inteiro a fotografia anterior do mesmo site e dia)
    canal: [upload]
    destino: fato_saldo_diario
    implementado: true
    snapshot: {por: [site, data_saldo]}
    chave: [sku, lote, endereco, data_saldo]
    campos:
      site:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      data_saldo:        {tipo: data, obrigatorio: true}
      instante_extracao: {tipo: instante, obrigatorio: true}
      sku:               {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      lote:              {tipo: texto, obrigatorio: false, max_len: 30}
      data_validade:     {tipo: data, obrigatorio: false}
      endereco:          {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: inferir}}
      qtd_fisica:        {tipo: decimal, obrigatorio: true, min: 0}
      qtd_bloqueada:     {tipo: decimal, obrigatorio: true, min: 0}
      qtd_reservada:     {tipo: decimal, obrigatorio: true, min: 0}
      custo_unit_medio:  {tipo: decimal, obrigatorio: true, min: 0}
    regras:
      - {expr: "qtd_bloqueada + qtd_reservada <= qtd_fisica", msg: "bloqueado + reservado não pode exceder o físico"}
      - {expr: "instante_extracao.date() >= data_saldo", msg: "extração anterior à data do saldo"}

  mov_estoque:
    descricao: Movimentos de estoque (todos os SKUs do período), com data do movimento E instante do lançamento
    canal: [upload]
    destino: fato_movimento_estoque
    implementado: true
    chave: [documento_tipo, documento_numero, item, sequencia, tipo_movimento]
    campos:
      documento_tipo:      {tipo: texto, obrigatorio: true, lista: documento_tipo}
      documento_numero:    {tipo: texto, obrigatorio: true, max_len: 40}
      item:                {tipo: inteiro, obrigatorio: true, min: 1}
      sequencia:           {tipo: inteiro, obrigatorio: true, min: 1}
      tipo_movimento:      {tipo: texto, obrigatorio: true, lista: tipos_movimento}
      sku:                 {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      lote:                {tipo: texto, obrigatorio: false, max_len: 30}
      data_validade:       {tipo: data, obrigatorio: false}
      endereco:            {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: inferir}}
      qtd:                 {tipo: decimal, obrigatorio: true}
      custo_unit:          {tipo: decimal, obrigatorio: true, min: 0}
      data_movimento:      {tipo: data, obrigatorio: true}
      instante_lancamento: {tipo: instante, obrigatorio: true}
      motivo:              {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
    regras:
      - {expr: "qtd != 0", msg: "quantidade zero não é movimento"}
      - {expr: "qtd * sinal_tipo(tipo_movimento) > 0", msg: "sinal da quantidade incoerente com o tipo de movimento"}
      - {expr: "instante_lancamento.date() >= data_movimento", msg: "lançamento anterior à data do movimento"}

  contagem:
    descricao: Contagem cega de uma posição (formulário ou upload de coletor/WMS). Recontagem final é derivada, não digitada.
    canal: [formulario, upload]
    destino: fato_contagem
    implementado: true
    chave: [numero_contagem, endereco, sku, lote, numero_recontagem]
    campos:
      numero_contagem:       {tipo: texto, obrigatorio: true, max_len: 40}
      numero_recontagem:     {tipo: inteiro, obrigatorio: true, min: 0, max: 9}
      endereco:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: rejeitar}}
      sku:                   {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      lote:                  {tipo: texto, obrigatorio: false, max_len: 30}
      qtd_contada:           {tipo: decimal, obrigatorio: true, min: 0}
      qtd_sistema_congelada: {tipo: decimal, obrigatorio: true, min: 0}
      instante_congelamento: {tipo: instante, obrigatorio: true}
      instante_contagem:     {tipo: instante, obrigatorio: true}
      matricula:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}
    regras:
      - {expr: "instante_contagem >= instante_congelamento", msg: "contagem anterior ao congelamento do saldo"}

  investigacao_divergencia:
    descricao: Resultado da investigação de uma divergência final de contagem (atribui a etapa de origem ao ajuste)
    canal: [formulario]
    destino: aux_investigacao
    implementado: true
    chave: [numero_contagem, endereco, sku, lote]
    campos:
      numero_contagem: {tipo: texto, obrigatorio: true, max_len: 40}
      endereco:        {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: rejeitar}}
      sku:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      lote:            {tipo: texto, obrigatorio: false, max_len: 30}
      motivo:          {tipo: texto, obrigatorio: true, ref: {cadastro: cad_motivo, ausente: rejeitar}}
      matricula:       {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}

  # ------------------------------------------- cadastros das frentes 2 e 3
  cad_cliente:
    descricao: Cliente com ponto de entrega, janela, prioridade de atendimento e validade mínima aceita
    canal: [upload]
    destino: dim_cliente
    implementado: true
    chave: [cliente]
    campos:
      cliente:              {tipo: texto, obrigatorio: true, max_len: 30}
      nome:                 {tipo: texto, obrigatorio: true, max_len: 120}
      municipio:            {tipo: texto, obrigatorio: true, max_len: 60}
      uf:                   {tipo: texto, obrigatorio: true, lista: uf}
      latitude:             {tipo: decimal, obrigatorio: true, min: -34, max: 6}
      longitude:            {tipo: decimal, obrigatorio: true, min: -74, max: -28}
      janela_inicio:        {tipo: hora, obrigatorio: true}
      janela_fim:           {tipo: hora, obrigatorio: true}
      prioridade:           {tipo: inteiro, obrigatorio: true, min: 1, max: 5}
      validade_minima_dias: {tipo: inteiro, obrigatorio: false, min: 0, max: 3650}
    regras:
      - {expr: "janela_fim > janela_inicio", msg: "fim da janela deve ser depois do início"}

  cad_parceiro:
    descricao: Parceiro (fornecedor e/ou transportadora), identificado por CNPJ
    canal: [upload]
    destino: dim_parceiro
    implementado: true
    chave: [cnpj]
    campos:
      cnpj:             {tipo: texto, obrigatorio: true, regex: "^[0-9]{14}$"}
      razao_social:     {tipo: texto, obrigatorio: true, max_len: 120}
      e_fornecedor:     {tipo: sim_nao, obrigatorio: true}
      e_transportadora: {tipo: sim_nao, obrigatorio: true}
    regras:
      - {expr: "e_fornecedor == 'S' or e_transportadora == 'S'", msg: "parceiro precisa ter ao menos um papel"}

  cad_parceiro_sku:
    descricao: Condição de fornecimento (lote mínimo, múltiplo, lead time contratado)
    canal: [upload]
    destino: parceiro_sku
    implementado: true
    chave: [cnpj, sku]
    campos:
      cnpj:                      {tipo: texto, obrigatorio: true, ref: {cadastro: cad_parceiro, ausente: rejeitar}}
      sku:                       {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      lote_minimo:               {tipo: decimal, obrigatorio: true, min: 0}
      multiplo_compra:           {tipo: decimal, obrigatorio: true, min: 0.000001}
      lead_time_contratado_dias: {tipo: inteiro, obrigatorio: true, min: 0, max: 365}

  cad_veiculo:
    descricao: Veículo com capacidade em kg e m³ e classe de temperatura
    canal: [upload]
    destino: dim_veiculo
    implementado: true
    chave: [placa]
    campos:
      placa:               {tipo: texto, obrigatorio: true, regex: "^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$"}
      tipo:                {tipo: texto, obrigatorio: true, lista: tipo_veiculo}
      cap_kg:              {tipo: decimal, obrigatorio: true, min: 1, max: 60000}
      cap_m3:              {tipo: decimal, obrigatorio: true, min: 0.1, max: 150}
      classe_temperatura:  {tipo: texto, obrigatorio: true, lista: classe_temperatura}
      propria:             {tipo: sim_nao, obrigatorio: true}
      transportadora_cnpj: {tipo: texto, obrigatorio: false, ref: {cadastro: cad_parceiro, ausente: rejeitar}}
    regras:
      - {expr: "propria == 'S' or not vazio(transportadora_cnpj)", msg: "veículo terceiro precisa da transportadora"}

  cad_recurso:
    descricao: Recurso produtivo; o restritivo (gargalo) é configurável
    canal: [upload]
    destino: dim_recurso
    implementado: true
    chave: [recurso]
    campos:
      recurso:      {tipo: texto, obrigatorio: true, max_len: 20}
      descricao:    {tipo: texto, obrigatorio: true, max_len: 80}
      site:         {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      tipo:         {tipo: texto, obrigatorio: true, lista: tipo_recurso}
      e_restritivo: {tipo: sim_nao, obrigatorio: true}

  cad_turno:
    descricao: Turno de trabalho (código único na empresa) com horas disponíveis
    canal: [upload]
    destino: dim_turno
    implementado: true
    chave: [turno]
    campos:
      turno:             {tipo: texto, obrigatorio: true, max_len: 10}
      site:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      inicio:            {tipo: hora, obrigatorio: true}
      fim:               {tipo: hora, obrigatorio: true}
      horas_disponiveis: {tipo: decimal, obrigatorio: true, min: 0.5, max: 24}

  cad_setup:
    descricao: Matriz de setup (minutos) por recurso e troca de família
    canal: [upload]
    destino: matriz_setup
    implementado: true
    chave: [recurso, familia_origem, familia_destino]
    campos:
      recurso:         {tipo: texto, obrigatorio: true, ref: {cadastro: cad_recurso, ausente: rejeitar}}
      familia_origem:  {tipo: texto, obrigatorio: true, max_len: 30}
      familia_destino: {tipo: texto, obrigatorio: true, max_len: 30}
      minutos:         {tipo: decimal, obrigatorio: true, min: 0, max: 1440}

  cad_acordo_validade:
    descricao: Validade mínima acordada por cliente × SKU (prevalece sobre o cliente e o SKU)
    canal: [upload]
    destino: acordo_validade
    implementado: true
    chave: [cliente, sku]
    campos:
      cliente:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_cliente, ausente: rejeitar}}
      sku:                  {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      validade_minima_dias: {tipo: inteiro, obrigatorio: true, min: 0, max: 3650}

  parametro_sku_local:
    descricao: Parâmetros de planejamento do gestor por SKU × site (entradas; os valores calculados ficam em F12)
    canal: [upload]
    destino: parametro_sku_local
    implementado: true
    chave: [sku, site]
    campos:
      sku:                      {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      site:                     {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      nivel_servico:            {tipo: decimal, obrigatorio: true, min: 0.5, max: 0.999}
      dias_parados:             {tipo: inteiro, obrigatorio: true, min: 0, max: 60}
      transito_dias:            {tipo: inteiro, obrigatorio: true, min: 0, max: 60}
      custo_pedido:             {tipo: decimal, obrigatorio: true, min: 0}
      taxa_manter_ano:          {tipo: decimal, obrigatorio: true, min: 0, max: 2}
      lead_time_reposicao_dias: {tipo: inteiro, obrigatorio: false, min: 0, max: 365}
      tolerancia_contagem_pct:  {tipo: decimal, obrigatorio: false, min: 0, max: 0.5}

  parametro_empresa:
    descricao: Políticas da empresa (regra de OTIF, limiares, janelas). Uma linha; nova carga = nova versão.
    canal: [upload]
    destino: parametro_empresa
    implementado: true
    chave: [empresa]
    campos:
      empresa:                {tipo: texto, obrigatorio: true, max_len: 20}
      otif_tolerancia_pct:    {tipo: decimal, obrigatorio: true, min: 0, max: 0.5}
      limiar_ocupacao:        {tipo: decimal, obrigatorio: true, min: 0, max: 1.5}
      limiar_k02b:            {tipo: decimal, obrigatorio: true, min: 0, max: 1}
      n_min_observacoes:      {tipo: inteiro, obrigatorio: true, min: 2, max: 1000}
      janela_demanda_dias:    {tipo: inteiro, obrigatorio: true, min: 7, max: 730}
      janela_lead_time_dias:  {tipo: inteiro, obrigatorio: true, min: 7, max: 730}
      janela_clientes_dias:   {tipo: inteiro, obrigatorio: true, min: 7, max: 730}
      apto_n_contagens:       {tipo: inteiro, obrigatorio: true, min: 1, max: 100}
      apto_janela_dias:       {tipo: inteiro, obrigatorio: true, min: 7, max: 365}
      apto_limiar:            {tipo: decimal, obrigatorio: true, min: 0, max: 1}
      horizonte_projecao_dias: {tipo: inteiro, obrigatorio: true, min: 7, max: 180}

  # ------------------------------------------- transacionais das frentes 2 e 3
  recebimento:
    descricao: Linha de recebimento conferida (F01)
    canal: [upload]
    destino: fato_recebimento
    implementado: true
    chave: [numero_recebimento, item, lote]
    campos:
      numero_recebimento:   {tipo: texto, obrigatorio: true, max_len: 40}
      item:                 {tipo: inteiro, obrigatorio: true, min: 1}
      numero_pc:            {tipo: texto, obrigatorio: false, max_len: 40}
      item_pc:              {tipo: inteiro, obrigatorio: false, min: 1}
      chave_nf_entrada:     {tipo: texto, obrigatorio: false, regex: "^[0-9]{44}$"}
      fornecedor_cnpj:      {tipo: texto, obrigatorio: true, ref: {cadastro: cad_parceiro, ausente: rejeitar}}
      sku:                  {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      lote:                 {tipo: texto, obrigatorio: false, max_len: 30}
      data_validade:        {tipo: data, obrigatorio: false}
      endereco:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: inferir}}
      qtd_esperada:         {tipo: decimal, obrigatorio: true, min: 0}
      qtd_recebida:         {tipo: decimal, obrigatorio: true, min: 0}
      qtd_recusada:         {tipo: decimal, obrigatorio: true, min: 0}
      motivo:               {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
      matricula_conferente: {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}
      instante_conferencia: {tipo: instante, obrigatorio: true}
    regras:
      - {expr: "qtd_recusada == 0 or not vazio(motivo)", msg: "recusa exige motivo"}
      - {expr: "vazio(numero_pc) == vazio(item_pc)", msg: "número e item do PC andam juntos"}

  pedido_compra_evento:
    descricao: Evento de linha de pedido de compra (emissão, alteração, cancelamento) → F05
    canal: [upload]
    destino: fato_pedido_compra_linha
    implementado: true
    chave: [numero_pc, item, numero_evento]
    campos:
      numero_pc:       {tipo: texto, obrigatorio: true, max_len: 40}
      item:            {tipo: inteiro, obrigatorio: true, min: 1}
      numero_evento:   {tipo: inteiro, obrigatorio: true, min: 1}
      tipo_evento:     {tipo: texto, obrigatorio: true, lista: evento_pedido}
      fornecedor_cnpj: {tipo: texto, obrigatorio: true, ref: {cadastro: cad_parceiro, ausente: rejeitar}}
      sku:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      site:            {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      delta_qtd:       {tipo: decimal, obrigatorio: true}
      data_prevista:   {tipo: data, obrigatorio: true}
      instante_evento: {tipo: instante, obrigatorio: true}
      motivo:          {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
    regras:
      - {expr: "tipo_evento != 'EMISSAO' or delta_qtd > 0", msg: "emissão precisa de quantidade positiva"}
      - {expr: "tipo_evento != 'CANCELAMENTO' or delta_qtd <= 0", msg: "cancelamento não aumenta quantidade"}

  programacao_op:
    descricao: OP alocada a recurso e turno numa versão do programa (F06a)
    canal: [upload]
    destino: fato_programacao_op
    implementado: true
    chave: [numero_op, recurso, data, turno, versao]
    campos:
      numero_op:           {tipo: texto, obrigatorio: true, max_len: 40}
      versao:              {tipo: inteiro, obrigatorio: true, min: 1}
      congelada:           {tipo: sim_nao, obrigatorio: true}
      data:                {tipo: data, obrigatorio: true}
      turno:               {tipo: texto, obrigatorio: true, ref: {cadastro: cad_turno, ausente: rejeitar}}
      recurso:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_recurso, ausente: rejeitar}}
      sku:                 {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      sequencia:           {tipo: inteiro, obrigatorio: true, min: 1}
      qtd_programada:      {tipo: decimal, obrigatorio: true, min: 0}
      tempo_padrao_min_un: {tipo: decimal, obrigatorio: true, min: 0}
      setup_min:           {tipo: decimal, obrigatorio: true, min: 0}

  apontamento:
    descricao: Apontamento de produção (F06b)
    canal: [upload]
    destino: fato_apontamento
    implementado: true
    chave: [numero_op, recurso, numero_apontamento]
    campos:
      numero_op:            {tipo: texto, obrigatorio: true, max_len: 40}
      numero_apontamento:   {tipo: inteiro, obrigatorio: true, min: 1}
      recurso:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_recurso, ausente: rejeitar}}
      turno:                {tipo: texto, obrigatorio: true, ref: {cadastro: cad_turno, ausente: rejeitar}}
      sku:                  {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: rejeitar}}
      lote:                 {tipo: texto, obrigatorio: false, max_len: 30}
      qtd_boa:              {tipo: decimal, obrigatorio: true, min: 0}
      qtd_refugo:           {tipo: decimal, obrigatorio: true, min: 0}
      motivo_refugo:        {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
      instante_apontamento: {tipo: instante, obrigatorio: true}
    regras:
      - {expr: "qtd_refugo == 0 or not vazio(motivo_refugo)", msg: "refugo exige motivo"}

  pedido_venda_evento:
    descricao: Evento do CLIENTE sobre linha de pedido de venda (F07) — corte próprio não entra aqui
    canal: [upload]
    destino: fato_evento_pedido_venda
    implementado: true
    chave: [numero_pedido, item, numero_evento]
    campos:
      numero_pedido:   {tipo: texto, obrigatorio: true, max_len: 40}
      item:            {tipo: inteiro, obrigatorio: true, min: 1}
      numero_evento:   {tipo: inteiro, obrigatorio: true, min: 1}
      tipo_evento:     {tipo: texto, obrigatorio: true, lista: evento_pedido_venda}
      cliente:         {tipo: texto, obrigatorio: true, ref: {cadastro: cad_cliente, ausente: rejeitar}}
      sku:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      site:            {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      delta_qtd:       {tipo: decimal, obrigatorio: true}
      data_desejada:   {tipo: data, obrigatorio: true}
      instante_evento: {tipo: instante, obrigatorio: true}
      motivo:          {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
    regras:
      - {expr: "tipo_evento != 'CRIACAO' or delta_qtd > 0", msg: "criação precisa de quantidade positiva"}
      - {expr: "tipo_evento != 'CANCELAMENTO' or delta_qtd <= 0", msg: "cancelamento não aumenta quantidade"}

  separacao:
    descricao: Tarefa de separação e conferência (F08). A ordem de separação é a remessa.
    canal: [upload]
    destino: fato_separacao
    implementado: true
    chave: [numero_tarefa]
    campos:
      numero_tarefa:        {tipo: texto, obrigatorio: true, max_len: 40}
      ordem_separacao:      {tipo: texto, obrigatorio: true, max_len: 40}
      numero_pedido:        {tipo: texto, obrigatorio: true, max_len: 40}
      item:                 {tipo: inteiro, obrigatorio: true, min: 1}
      sku:                  {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      lote:                 {tipo: texto, obrigatorio: false, max_len: 30}
      endereco:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_local, ausente: inferir}}
      qtd_solicitada:       {tipo: decimal, obrigatorio: true, min: 0}
      qtd_separada:         {tipo: decimal, obrigatorio: true, min: 0}
      qtd_conferida:        {tipo: decimal, obrigatorio: true, min: 0}
      matricula_separador:  {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}
      matricula_conferente: {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}
      instante_separacao:   {tipo: instante, obrigatorio: true}
      instante_conferencia: {tipo: instante, obrigatorio: true}
      motivo:               {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
    regras:
      - {expr: "instante_conferencia >= instante_separacao", msg: "conferência anterior à separação"}
      - {expr: "(qtd_separada == qtd_solicitada and qtd_conferida == qtd_separada) or not vazio(motivo)", msg: "divergência na separação/conferência exige motivo"}

  faturamento:
    descricao: Item de NF de saída ligado a linha de pedido e remessa (F09). Sem ordem de separação, a remessa é a NF.
    canal: [upload]
    destino: fato_faturamento
    implementado: true
    chave: [chave_nf, item_nf]
    campos:
      chave_nf:         {tipo: texto, obrigatorio: true, regex: "^[0-9]{44}$"}
      item_nf:          {tipo: inteiro, obrigatorio: true, min: 1}
      numero_pedido:    {tipo: texto, obrigatorio: true, max_len: 40}
      item_pedido:      {tipo: inteiro, obrigatorio: true, min: 1}
      ordem_separacao:  {tipo: texto, obrigatorio: false, max_len: 40}
      cliente:          {tipo: texto, obrigatorio: true, ref: {cadastro: cad_cliente, ausente: rejeitar}}
      sku:              {tipo: texto, obrigatorio: true, ref: {cadastro: cad_sku, ausente: inferir}}
      site:             {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      qtd:              {tipo: decimal, obrigatorio: true, min: 0}
      valor_mercadoria: {tipo: decimal, obrigatorio: true, min: 0}
      instante_emissao: {tipo: instante, obrigatorio: true}

  viagem:
    descricao: Viagem de veículo (F10a). Peso e volume são calculados pelas remessas entregues, não digitados.
    canal: [upload]
    destino: fato_viagem
    implementado: true
    chave: [numero_viagem]
    campos:
      numero_viagem:       {tipo: texto, obrigatorio: true, max_len: 40}
      placa:               {tipo: texto, obrigatorio: true, ref: {cadastro: cad_veiculo, ausente: rejeitar}}
      matricula_motorista: {tipo: texto, obrigatorio: true, ref: {cadastro: cad_colaborador, ausente: rejeitar}}
      site:                {tipo: texto, obrigatorio: true, ref: {cadastro: cad_site, ausente: rejeitar}}
      custo_viagem:        {tipo: decimal, obrigatorio: true, min: 0}
      instante_saida:      {tipo: instante, obrigatorio: true}
      instante_retorno:    {tipo: instante, obrigatorio: false}
    regras:
      - {expr: "vazio(instante_retorno) or instante_retorno > instante_saida", msg: "retorno anterior à saída"}

  entrega:
    descricao: Tentativa de entrega de uma remessa (F10b). Remessa = ordem de separação (ou chave da NF, se não houver ordem).
    canal: [upload]
    destino: fato_entrega
    implementado: true
    chave: [numero_viagem, remessa, numero_tentativa]
    campos:
      numero_viagem:      {tipo: texto, obrigatorio: true, max_len: 40}
      remessa:            {tipo: texto, obrigatorio: true, max_len: 44}
      numero_tentativa:   {tipo: inteiro, obrigatorio: true, min: 1, max: 9}
      cliente:            {tipo: texto, obrigatorio: true, ref: {cadastro: cad_cliente, ausente: rejeitar}}
      status:             {tipo: texto, obrigatorio: true, lista: status_entrega}
      motivo:             {tipo: texto, obrigatorio: false, ref: {cadastro: cad_motivo, ausente: rejeitar}}
      instante_chegada:   {tipo: instante, obrigatorio: true}
      instante_conclusao: {tipo: instante, obrigatorio: true}
    regras:
      - {expr: "instante_conclusao >= instante_chegada", msg: "conclusão anterior à chegada"}
      - {expr: "status == 'ENTREGUE' or not vazio(motivo)", msg: "entrega frustrada ou parcial exige motivo"}
