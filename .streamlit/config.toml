[theme]
# Vermelho é cor de status (crítico) na paleta do painel; a cor de destaque da interface é o azul da série 1.
primaryColor = "#2a78d6"

[browser]
# Não envia estatísticas de uso para fora da empresa.
gatherUsageStats = false

[server]
# Só o próprio computador acessa: o protótipo não tem login (docs/08, §6).
address = "localhost"
